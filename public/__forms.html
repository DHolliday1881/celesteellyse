<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify forms</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="page" />
      <input name="bot-field" />
      <input name="first-name" type="text" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
    </form>
    <form name="intake-animal-communication" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="intake-animal-communication" />
      <input name="bot-field" />
      <input name="first-name" type="text" />
      <input name="email" type="email" />
      <input name="animal-name" type="text" />
      <input name="photo" type="file" />
      <input name="living-or-passed" type="text" />
      <input name="age" type="text" />
      <input name="sex" type="text" />
      <input name="humans" type="text" />
      <input name="other-animals" type="text" />
      <input name="question-1" type="text" />
      <input name="question-2" type="text" />
      <input name="question-3" type="text" />
      <input name="question-4" type="text" />
      <input name="question-5" type="text" />
      <textarea name="anything-else"></textarea>
      <input name="share-name" type="text" />
      <input name="share-photo" type="text" />
      <input name="share-reading" type="text" />
    </form>
    <form name="intake-two-animals" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>

      <input name="humans" type="text" />
      <input name="other-animals" type="text" />
      <input name="animal-1-question-1" type="text" />
      <input name="animal-1-question-2" type="text" />
      <input name="animal-1-question-3" type="text" />
      <input name="animal-2-name" type="text" />
      <input name="animal-2-photo" type="file" />

      <input name="animal-2-question-3" type="text" />
      <textarea name="anything-else"></textarea>
      <input name="share-name" type="text" />
      <input name="share-photo" type="text" />
      <input name="share-reading" type="text" />
    </form>
    <form name="intake-communication-and-reiki" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="intake-communication-and-reiki" />
      <input name="bot-field" />
      <input name="first-name" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="animal-name" type="text" />
      <input name="photo" type="file" />

      <input name="share-name" type="text" />

      <input name="share-reading" type="text" />
    </form>
    <form name="intake-animal-reiki" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
